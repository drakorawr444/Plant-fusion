<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Garden Fusion</title>

<style>
:root {
  --outline:#172219;
  --cream:#f7edc5;
  --wood:#9d6338;
  --wood-dark:#5e3825;
  --grass:#6e9c4a;
  --grass-dark:#4e793d;
  --gold:#f4c84e;
  --red:#9c3e32;
}

* { box-sizing:border-box; }

body {
  margin:0;
  min-height:100vh;
  overflow-x:hidden;
  color:var(--outline);
  font-family:Georgia,serif;
  background:
    linear-gradient(#82b7c1 0 32%,#678c4e 32% 100%);
}

button {
  border:4px solid var(--outline);
  border-radius:12px;
  padding:12px 24px;
  color:var(--outline);
  background:var(--gold);
  box-shadow:0 5px 0 var(--outline);
  cursor:pointer;
  font:700 18px Georgia,serif;
}

button:active {
  transform:translateY(4px);
  box-shadow:0 1px 0 var(--outline);
}

button:hover { filter:brightness(1.08); }

.screen {
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
}

.menu {
  width:min(900px,95vw);
  min-height:650px;
  position:relative;
  overflow:hidden;
  border:7px solid var(--outline);
  border-radius:28px;
  background:
    linear-gradient(#9ccdd2 0 49%,#77a554 49% 100%);
  box-shadow:0 14px 0 rgba(23,34,25,.35),0 25px 45px rgba(23,34,25,.3);
}

.menu:after {
  content:"";
  position:absolute;
  inset:49% 0 0;
  background:
    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,.04) 0 70px,
      rgba(0,0,0,.05) 70px 140px
    );
  pointer-events:none;
}

.cloud {
  position:absolute;
  width:150px;
  height:46px;
  border-radius:40px;
  background:#fff6d7;
  opacity:.8;
}

.cloud:before,
.cloud:after {
  content:"";
  position:absolute;
  border-radius:50%;
  background:#fff6d7;
}

.cloud:before {
  width:70px;
  height:70px;
  left:25px;
  bottom:0;
}

.cloud:after {
  width:90px;
  height:90px;
  right:20px;
  bottom:0;
}

.cloud.one { top:80px;left:70px; }
.cloud.two { top:135px;right:90px;transform:scale(.7); }

.sun {
  position:absolute;
  top:46px;
  right:55px;
  width:90px;
  height:90px;
  border:6px solid #966b27;
  border-radius:50%;
  background:#ffd866;
  box-shadow:0 0 0 14px rgba(255,216,102,.25);
}

.title {
  position:relative;
  z-index:2;
  margin:54px 0 8px;
  color:#fff4bd;
  text-align:center;
  font-size:clamp(50px,10vw,100px);
  line-height:.85;
  letter-spacing:-7px;
  text-shadow:
    5px 5px 0 var(--outline),
    9px 9px 0 #9c5a31;
}

.tagline {
  position:relative;
  z-index:2;
  margin:0 auto;
  color:#fff8d7;
  text-align:center;
  font-size:22px;
  font-weight:bold;
  text-shadow:3px 3px 0 var(--outline);
}

.house {
  position:absolute;
  z-index:2;
  left:50%;
  bottom:104px;
  width:230px;
  height:150px;
  transform:translateX(-50%);
  border:6px solid var(--outline);
  background:#e0aa68;
}

.house:before {
  content:"";
  position:absolute;
  left:-32px;
  top:-91px;
  width:285px;
  height:130px;
  border:6px solid var(--outline);
  background:#a64d3e;
  transform:skew(-28deg);
}

.house-window,
.house-door {
  position:absolute;
  z-index:3;
  border:5px solid var(--outline);
}

.house-window {
  top:38px;
  left:30px;
  width:58px;
  height:54px;
  background:#82c1c2;
}

.house-door {
  right:34px;
  bottom:0;
  width:56px;
  height:92px;
  background:#70442e;
}

.house-window:after {
  content:"";
  position:absolute;
  inset:22px 0 0;
  border-top:5px solid var(--outline);
}

.fence {
  position:absolute;
  z-index:3;
  bottom:95px;
  width:125px;
  height:46px;
  border-top:8px solid var(--outline);
  border-bottom:8px solid var(--outline);
}

.fence:after {
  content:"";
  position:absolute;
  inset:-20px 12px;
  background:repeating-linear-gradient(
    90deg,
    var(--cream) 0 17px,
    transparent 17px 31px
  );
  border-left:5px solid var(--outline);
  border-right:5px solid var(--outline);
}

.fence.left { left:40px; }
.fence.right { right:40px; }

.menu-buttons {
  position:absolute;
  z-index:5;
  left:50%;
  bottom:28px;
  display:flex;
  gap:14px;
  transform:translateX(-50%);
}

.menu-buttons button {
  min-width:180px;
}

.menu-buttons .options {
  background:var(--cream);
}

#gameScreen {
  display:none;
  width:min(1200px,97vw);
  margin:auto;
  padding:16px 0 32px;
}

.topbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:12px;
  border:5px solid var(--outline);
  border-radius:16px;
  background:var(--wood);
  box-shadow:0 6px 0 var(--wood-dark);
}

.logo-small {
  color:#fff3bc;
  font-size:28px;
  font-weight:bold;
  text-shadow:3px 3px 0 var(--outline);
}

.resources {
  display:flex;
  gap:10px;
}

.resource {
  padding:9px 15px;
  border:4px solid var(--outline);
  border-radius:10px;
  background:var(--cream);
  font-weight:bold;
}

.board-frame {
  position:relative;
  margin-top:14px;
  padding:10px;
  border:6px solid var(--outline);
  border-radius:17px;
  background:var(--wood);
  box-shadow:0 9px 0 var(--wood-dark);
}

canvas {
  display:block;
  width:100%;
  height:auto;
  border:4px solid var(--outline);
  border-radius:8px;
  background:#75a856;
}

.seed-bank {
  display:flex;
  gap:9px;
  overflow-x:auto;
  margin-top:14px;
  padding:10px;
  border:5px solid var(--outline);
  border-radius:15px;
  background:var(--wood);
  box-shadow:0 6px 0 var(--wood-dark);
}

.seed-card {
  min-width:125px;
  padding:8px;
  border:4px solid var(--outline);
  border-radius:10px;
  background:var(--cream);
  cursor:pointer;
}

.seed-card.selected {
  background:#ffe27b;
  transform:translateY(-5px);
}

.seed-card strong,
.seed-card small {
  display:block;
}

.seed-icon {
  width:54px;
  height:54px;
  margin:auto auto 5px;
  border:4px solid var(--outline);
  border-radius:50%;
  background:#80a958;
  position:relative;
}

.seed-icon:before {
  content:"";
  position:absolute;
  width:22px;
  height:34px;
  left:12px;
  top:7px;
  border:4px solid var(--outline);
  border-radius:100% 0 100% 0;
  background:var(--plant-color,#edca55);
  transform:rotate(-30deg);
}

.seed-icon:after {
  content:"";
  position:absolute;
  width:10px;
  height:10px;
  left:18px;
  top:29px;
  border:2px solid var(--outline);
  border-radius:50%;
  background:#fff3bb;
}

#message {
  min-height:25px;
  margin:12px;
  text-align:center;
  font-weight:bold;
}

.modal {
  position:fixed;
  inset:0;
  z-index:20;
  display:grid;
  place-items:center;
  background:rgba(10,20,12,.7);
}

.modal-box {
  width:min(500px,92vw);
  padding:30px;
  border:6px solid var(--outline);
  border-radius:18px;
  background:var(--cream);
  text-align:center;
  box-shadow:0 10px 0 var(--outline);
}

.modal-box h2 {
  margin-top:0;
  color:#41633a;
  font-size:34px;
}

.hidden { display:none!important; }

@media(max-width:650px) {
  .title { letter-spacing:-4px; }
  .house { transform:translateX(-50%) scale(.8); }
  .fence.left { left:8px; }
  .fence.right { right:8px; }
  .menu-buttons {
    width:100%;
    flex-direction:column;
    align-items:center;
  }
}
</style>
</head>

<body>

<section id="menuScreen" class="screen">
  <main class="menu">
    <div class="cloud one"></div>
    <div class="cloud two"></div>
    <div class="sun"></div>

    <h1 class="title">Garden<br>Fusion</h1>
    <p class="tagline">Defend the garden. Combine the strange.</p>

    <div class="house">
      <div class="house-window"></div>
      <div class="house-door"></div>
    </div>

    <div class="fence left"></div>
    <div class="fence right"></div>

    <div class="menu-buttons">
      <button id="startButton">Adventure</button>
      <button class="options" id="helpButton">How To Play</button>
    </div>
  </main>
</section>

<section id="gameScreen">
  <header class="topbar">
    <div class="logo-small">Garden Fusion</div>
    <div class="resources">
      <div class="resource">Sun: <span id="sun">150</span></div>
      <div class="resource">Wave: <span id="wave">1</span></div>
      <div class="resource">Score: <span id="score">0</span></div>
    </div>
    <button id="pauseButton">Pause</button>
  </header>

  <div class="board-frame">
    <canvas id="game" width="1100" height="600"></canvas>
  </div>

  <div id="seedBank" class="seed-bank"></div>
  <div id="message"></div>
</section>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h2 id="modalTitle"></h2>
    <p id="modalText"></p>
    <button id="modalClose">Continue</button>
  </div>
</div>

<script>
const canvas = document.querySelector("#game");
const ctx = canvas.getContext("2d");

const ROWS = 5;
const COLS = 9;
const TILE_W = 104;
const TILE_H = 96;
const BOARD_X = 125;
const BOARD_Y = 88;

const types = {
  sunbud: {
    name:"Sunbud",
    cost:50,
    color:"#ebca58",
    damage:24,
    interval:1300,
    projectile:"#ffe580"
  },
  barkroot: {
    name:"Barkroot",
    cost:75,
    color:"#a96f4e",
    health:520,
    interval:0
  },
  frostleaf: {
    name:"Frostleaf",
    cost:100,
    color:"#85ced0",
    damage:16,
    interval:1050,
    projectile:"#c9ffff"
  },
  emberbloom: {
    name:"Emberbloom",
    cost:125,
    color:"#db674d",
    damage:55,
    interval:1900,
    projectile:"#ff9c58"
  }
};

const game = {
  active:false,
  paused:false,
  time:0,
  last:0,
  sun:150,
  wave:1,
  score:0,
  spawn:0,
  selected:"sunbud",
  plants:[],
  enemies:[],
  shots:[],
  particles:[]
};

function createSeedCards() {
  const bank = document.querySelector("#seedBank");

  Object.keys(types).forEach(kind => {
    const data = types[kind];
    const card = document.createElement("button");

    card.className = "seed-card";
    card.dataset.kind = kind;
    card.innerHTML = `
      <span class="seed-icon" style="--plant-color:${data.color}"></span>
      <strong>${data.name}</strong>
      <small>${data.cost} sun</small>
    `;

    card.onclick = () => {
      game.selected = kind;
      document.querySelectorAll(".seed-card")
        .forEach(x => x.classList.remove("selected"));
      card.classList.add("selected");
      message(`${data.name} selected.`);
    };

    bank.appendChild(card);
  });

  bank.firstElementChild.classList.add("selected");
}

function message(text) {
  document.querySelector("#message").textContent = text;
}

function tileFromMouse(event) {
  const rect = canvas.getBoundingClientRect();
  const x = (event.clientX - rect.left) * canvas.width / rect.width;
  const y = (event.clientY - rect.top) * canvas.height / rect.height;

  const col = Math.floor((x - BOARD_X) / TILE_W);
  const row = Math.floor((y - BOARD_Y) / TILE_H);

  if (row < 0 || row >= ROWS || col < 0 || col >= COLS) {
    return null;
  }

  return {
    row,
    col,
    x:BOARD_X + col * TILE_W + TILE_W / 2,
    y:BOARD_Y + row * TILE_H + TILE_H / 2
  };
}

canvas.onclick = event => {
  if (!game.active || game.paused) return;

  const tile = tileFromMouse(event);
  if (!tile) return;

  const existing = game.plants.find(
    plant => plant.row === tile.row && plant.col === tile.col
  );

  const data = types[game.selected];

  if (existing) {
    if (existing.kind === game.selected && existing.level < 3) {
      existing.level++;
      existing.health = Math.round(existing.health * 1.65);
      existing.maxHealth = existing.health;
      existing.damage = Math.round(existing.damage * 1.5);
      burst(existing.x,existing.y,"#fff3a3",18);
      message(`${data.name} fused to level ${existing.level}.`);
    } else {
      message("That tile is already occupied.");
    }
    return;
  }

  if (game.sun < data.cost) {
    message("You need more sun.");
    return;
  }

  game.sun -= data.cost;

  const health = data.health || 160;

  game.plants.push({
    kind:game.selected,
    row:tile.row,
    col:tile.col,
    x:tile.x,
    y:tile.y,
    level:1,
    health,
    maxHealth:health,
    damage:data.damage || 0,
    timer:500
  });

  burst(tile.x,tile.y,data.color,12);
};

function startGame() {
  game.active = true;
  game.paused = false;
  game.time = 0;
  game.last = performance.now();
  game.sun = 150;
  game.wave = 1;
  game.score = 0;
  game.spawn = 0;
  game.plants = [];
  game.enemies = [];
  game.shots = [];
  game.particles = [];

  document.querySelector("#menuScreen").classList.add("hidden");
  document.querySelector("#gameScreen").style.display = "block";
  message("Choose a seed packet and protect the house.");
  requestAnimationFrame(loop);
}

function spawnEnemy() {
  const row = Math.floor(Math.random() * ROWS);
  const elite = game.wave >= 3 && Math.random() < .18;
  const health = elite ? 400 + game.wave * 35 : 150 + game.wave * 25;

  game.enemies.push({
    row,
    x:canvas.width + 40,
    y:BOARD_Y + row * TILE_H + TILE_H / 2,
    health,
    maxHealth:health,
    speed:elite ? 13 : 20 + game.wave * 1.4,
    damage:elite ? 42 : 25,
    attack:0,
    slow:0,
    elite
  });
}

function update(dt) {
  game.time += dt;
  game.sun += dt * .006;
  game.spawn -= dt;

  if (game.time > game.wave * 30000) {
    game.wave++;
    message(`Wave ${game.wave} has begun.`);
  }

  if (game.spawn <= 0) {
    spawnEnemy();
    game.spawn = Math.max(650,2600 - game.wave * 150);
  }

  for (const plant of game.plants) {
    plant.timer -= dt;

    if (plant.timer <= 0 && plant.damage) {
      const target = game.enemies
        .filter(enemy => enemy.row === plant.row && enemy.x > plant.x)
        .sort((a,b) => a.x - b.x)[0];

      if (target) {
        const data = types[plant.kind];

        game.shots.push({
          x:plant.x + 28,
          y:plant.y - 4,
          row:plant.row,
          damage:plant.damage * plant.level,
          color:data.projectile,
          frost:plant.kind === "frostleaf",
          radius:plant.kind === "emberbloom" ? 11 : 7
        });
      }

      plant.timer = types[plant.kind].interval /
        (1 + (plant.level - 1) * .25);
    }
  }

  for (const shot of game.shots) {
    shot.x += 290 * dt / 1000;

    const target = game.enemies.find(enemy =>
      enemy.row === shot.row &&
      Math.abs(enemy.x - shot.x) < 22 &&
      enemy.health > 0
    );

    if (target) {
      target.health -= shot.damage;
      if (shot.frost) target.slow = 1800;
      shot.dead = true;

      if (target.health <= 0) {
        game.score += target.elite ? 50 : 15;
        burst(target.x,target.y,"#78934e",12);
      }
    }

    if (shot.x > canvas.width + 50) shot.dead = true;
  }

  game.shots = game.shots.filter(shot => !shot.dead);

  for (const enemy of game.enemies) {
    enemy.slow = Math.max(0,enemy.slow - dt);

    const col = Math.floor((enemy.x - BOARD_X) / TILE_W);
    const plant = game.plants.find(item =>
      item.row === enemy.row &&
      item.col === col &&
      Math.abs(item.x - enemy.x) < 45
    );

    if (plant) {
      enemy.attack -= dt;

      if (enemy.attack <= 0) {
        plant.health -= enemy.damage;
        enemy.attack = 850;
        burst(plant.x,plant.y,"#c7684b",4);
      }
    } else {
      enemy.x -= enemy.speed *
        (enemy.slow > 0 ? .42 : 1) *
        dt / 1000;
    }

    if (enemy.x < 50) {
      game.active = false;
      openModal(
        "The Garden Was Overrun",
        `You reached wave ${game.wave} with ${game.score} points.`,
        "Return to Menu",
        () => {
          document.querySelector("#gameScreen").style.display = "none";
          document.querySelector("#menuScreen").classList.remove("hidden");
        }
      );
    }
  }

  game.enemies = game.enemies.filter(enemy =>
    enemy.health > 0 && enemy.x > -60
  );

  game.plants = game.plants.filter(plant => plant.health > 0);

  for (const particle of game.particles) {
    particle.life -= dt;
    particle.x += particle.vx * dt / 1000;
    particle.y += particle.vy * dt / 1000;
    particle.vy += 30 * dt / 1000;
  }

  game.particles = game.particles.filter(p => p.life > 0);

  document.querySelector("#sun").textContent = Math.floor(game.sun);
  document.querySelector("#wave").textContent = game.wave;
  document.querySelector("#score").textContent = game.score;
}

function drawWorld() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="#a5d2d2";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="#4b713d";
  ctx.fillRect(0,0,canvas.width,72);

  ctx.fillStyle="#fbd66d";
  ctx.beginPath();
  ctx.arc(900,45,31,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle="#86652b";
  ctx.lineWidth=4;
  ctx.stroke();

  drawHouse();

  for (let row=0;row<ROWS;row++) {
    for (let col=0;col<COLS;col++) {
      const x=BOARD_X + col*TILE_W;
      const y=BOARD_Y + row*TILE_H;

      ctx.fillStyle=(row+col)%2
        ? "#6f9e4e"
        : "#7eaa57";

      ctx.fillRect(x,y,TILE_W,TILE_H);

      ctx.strokeStyle="rgba(23,34,25,.2)";
      ctx.lineWidth=2;
      ctx.strokeRect(x,y,TILE_W,TILE_H);
    }
  }
}

function drawHouse() {
  ctx.fillStyle="#a74f40";
  ctx.beginPath();
  ctx.moveTo(15,115);
  ctx.lineTo(60,68);
  ctx.lineTo(108,115);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle="#172219";
  ctx.lineWidth=5;
  ctx.stroke();

  ctx.fillStyle="#dfa968";
  ctx.fillRect(27,112,67,86);
  ctx.strokeRect(27,112,67,86);

  ctx.fillStyle="#82bdc0";
  ctx.fillRect(38,130,22,25);
  ctx.strokeRect(38,130,22,25);

  ctx.fillStyle="#70452e";
  ctx.fillRect(70,143,17,55);
  ctx.strokeRect(70,143,17,55);
}

function drawPlant(plant) {
  const data=types[plant.kind];

  ctx.save();
  ctx.translate(plant.x,plant.y);
  ctx.scale(1 + (plant.level-1)*.1,1 + (plant.level-1)*.1);

  ctx.fillStyle="rgba(23,34,25,.25)";
  ctx.beginPath();
  ctx.ellipse(0,31,31,8,0,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#527d43";
  ctx.beginPath();
  ctx.ellipse(-16,18,18,8,-.5,0,Math.PI*2);
  ctx.ellipse(16,18,18,8,.5,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle=data.color;
  ctx.beginPath();
  ctx.arc(0,-3,26,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle="#172219";
  ctx.lineWidth=4;
  ctx.stroke();

  if (plant.kind === "barkroot") {
    ctx.fillStyle="#754b38";
    ctx.fillRect(-13,-16,26,32);
    ctx.strokeRect(-13,-16,26,32);
    ctx.strokeStyle="#e0a26e";
    ctx.beginPath();
    ctx.moveTo(-8,-10);
    ctx.lineTo(8,0);
    ctx.lineTo(-5,10);
    ctx.stroke();
  } else {
    ctx.fillStyle="#fff1bd";
    ctx.beginPath();
    ctx.arc(-9,-6,6,0,Math.PI*2);
    ctx.arc(9,-6,6,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle="#172219";
    ctx.beginPath();
    ctx.arc(-9,-6,2,0,Math.PI*2);
    ctx.arc(9,-6,2,0,Math.PI*2);
    ctx.fill();
  }

  ctx.restore();

  ctx.fillStyle="#263d2a";
  ctx.fillRect(plant.x-28,plant.y+38,56,6);

  ctx.fillStyle="#72bb60";
  ctx.fillRect(
    plant.x-28,
    plant.y+38,
    56 * Math.max(0,plant.health/plant.maxHealth),
    6
  );
}

function drawEnemy(enemy) {
  ctx.save();
  ctx.translate(enemy.x,enemy.y);

  ctx.fillStyle=enemy.elite ? "#975145" : "#6f8754";
  ctx.beginPath();
  ctx.roundRect(-25,-29,50,57,16);
  ctx.fill();

  ctx.strokeStyle="#172219";
  ctx.lineWidth=4;
  ctx.stroke();

  ctx.fillStyle="#edf0c7";
  ctx.beginPath();
  ctx.arc(-9,-8,6,0,Math.PI*2);
  ctx.arc(9,-8,6,0,Math.PI*2);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle="#172219";
  ctx.beginPath();
  ctx.arc(-9,-8,2,0,Math.PI*2);
  ctx.arc(9,-8,2,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(-10,11);
  ctx.lineTo(10,11);
  ctx.stroke();

  if (enemy.slow > 0) {
    ctx.strokeStyle="#c9ffff";
    ctx.beginPath();
    ctx.arc(0,0,35,0,Math.PI*2);
    ctx.stroke();
  }

  ctx.restore();

  ctx.fillStyle="#263d2a";
  ctx.fillRect(enemy.x-29,enemy.y-43,58,6);
  ctx.fillStyle="#d56550";
  ctx.fillRect(
    enemy.x-29,
    enemy.y-43,
    58*Math.max(0,enemy.health/enemy.maxHealth),
    6
  );
}

function draw() {
  drawWorld();

  game.plants.forEach(drawPlant);
  game.enemies.forEach(drawEnemy);

  for (const shot of game.shots) {
    ctx.fillStyle=shot.color;
    ctx.beginPath();
    ctx.arc(shot.x,shot.y,shot.radius,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle="#172219";
    ctx.lineWidth=2;
    ctx.stroke();
  }

  for (const particle of game.particles) {
    ctx.globalAlpha=Math.max(0,particle.life/700);
    ctx.fillStyle=particle.color;
    ctx.fillRect(particle.x,particle.y,particle.size,particle.size);
  }

  ctx.globalAlpha=1;

  if (game.paused) {
    ctx.fillStyle="rgba(10,20,12,.65)";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="#fff0bd";
    ctx.font="bold 45px Georgia";
    ctx.textAlign="center";
    ctx.fillText("Paused",canvas.width/2,canvas.height/2);
  }
}

function burst(x,y,color,count) {
  for (let i=0;i<count;i++) {
    const angle=Math.random()*Math.PI*2;
    const speed=25+Math.random()*90;

    game.particles.push({
      x,y,color,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed-30,
      size:3+Math.random()*5,
      life:300+Math.random()*400
    });
  }
}

function loop(now) {
  if (!game.active) return;

  const dt=Math.min(50,now-game.last);
  game.last=now;

  if (!game.paused) update(dt);
  draw();

  requestAnimationFrame(loop);
}

function openModal(title,text,buttonText,callback) {
  document.querySelector("#modalTitle").textContent=title;
  document.querySelector("#modalText").textContent=text;
  document.querySelector("#modalClose").textContent=buttonText;
  document.querySelector("#modal").classList.remove("hidden");

  document.querySelector("#modalClose").onclick=() => {
    document.querySelector("#modal").classList.add("hidden");
    if (callback) callback();
  };
}

document.querySelector("#startButton").onclick=startGame;

document.querySelector("#helpButton").onclick=() => {
  openModal(
    "How To Play",
    "Select a seed packet and click a lawn tile. Place matching plants on the same tile to fuse them into stronger forms. Collect time-generated sun, stop enemies from reaching the house, and survive increasingly difficult waves.",
    "Ready"
  );
};

document.querySelector("#pauseButton").onclick=() => {
  game.paused=!game.paused;
  document.querySelector("#pauseButton").textContent =
    game.paused ? "Resume" : "Pause";
};

createSeedCards();
</script>
</body>
</html>
