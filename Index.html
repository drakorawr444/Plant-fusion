<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plant Fusion Defense</title>
<style>
:root {
  --bg:#102117;
  --panel:#1d3424;
  --grass:#66b653;
  --grass2:#5aa54d;
  --yellow:#ffdb55;
  --text:#efffe9;
}
* { box-sizing:border-box; }
body {
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  color:var(--text);
  font-family:system-ui,sans-serif;
  background:radial-gradient(circle at top,#527d4d,#0b140e 75%);
}
.app { width:min(1180px,96vw); }
header {
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  background:var(--panel);
  border:1px solid #648568;
  border-radius:16px 16px 0 0;
}
h1 { margin:0 auto 0 0; font-size:clamp(18px,4vw,30px); }
button {
  border:0;
  border-radius:9px;
  padding:10px 14px;
  color:#142016;
  background:#a9e96f;
  font-weight:800;
  cursor:pointer;
}
button:hover { filter:brightness(1.12); }
#sun {
  color:var(--yellow);
  background:#101b12;
  border:1px solid #708f4f;
  padding:9px 13px;
  border-radius:30px;
  font-weight:900;
}
.game {
  position:relative;
  overflow:hidden;
  border:1px solid #648568;
  border-top:0;
  border-radius:0 0 16px 16px;
  box-shadow:0 18px 45px #0009;
}
canvas {
  display:block;
  width:100%;
  height:auto;
  aspect-ratio:16/9;
  cursor:crosshair;
}
#seeds {
  position:absolute;
  left:12px;
  bottom:12px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.seed {
  color:white;
  background:#17321eec;
  border:1px solid #71906a;
  min-width:105px;
  text-align:left;
}
.seed.selected { outline:3px solid var(--yellow); }
.seed small { display:block;color:#cbe6b9; }
#notice {
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  color:white;
  font-size:clamp(26px,6vw,70px);
  font-weight:1000;
  text-align:center;
  text-shadow:0 5px 15px #000;
  pointer-events:none;
  opacity:0;
  transition:.25s;
}
#notice.show { opacity:1; }
.tip {
  padding:10px;
  text-align:center;
  color:#d1e5ca;
  font-size:13px;
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🌿 Plant Fusion Defense</h1>
    <div id="sun">☀ <span>150</span></div>
    <button id="pause">Pause</button>
    <button id="restart">Restart</button>
  </header>

  <div class="game">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div id="seeds"></div>
    <div id="notice"></div>
  </div>

  <div class="tip">
    Select a plant, click a tile to place it, then place the same plant on that tile to fuse it.
  </div>
</div>

<script>
"use strict";

const canvas = document.querySelector("#canvas");
const ctx = canvas.getContext("2d");
const seedBar = document.querySelector("#seeds");
const sunLabel = document.querySelector("#sun span");
const notice = document.querySelector("#notice");
const pauseButton = document.querySelector("#pause");
const restartButton = document.querySelector("#restart");

const W = 1280;
const H = 720;
const ROWS = 5;
const COLS = 9;
const BOARD = { x:190, y:92, cellW:108, cellH:108 };

const plants = {
  pea: {
    label:"🌱 Peashooter",
    cost:100,
    hp:125,
    cooldown:1.2,
    damage:25,
    color:"#54cf65"
  },
  sun: {
    label:"🌻 Sun Bloom",
    cost:75,
    hp:100,
    cooldown:6,
    color:"#ffd43f"
  },
  wall: {
    label:"🥜 Shellnut",
    cost:50,
    hp:430,
    color:"#a7784d"
  }
};

const fusions = {
  pea: {
    label:"🌿 Twin Peashooter",
    hp:280,
    cooldown:.62,
    damage:36,
    color:"#42ef77",
    double:true
  },
  sun: {
    label:"🌼 Sun Orchard",
    hp:220,
    cooldown:3.7,
    sun:50,
    color:"#ffe65c"
  },
  wall: {
    label:"🏰 Fortress Nut",
    hp:900,
    color:"#a96e3c"
  }
};

let game;

function freshGame() {
  return {
    time:0,
    sun:150,
    score:0,
    wave:1,
    selected:"pea",
    running:true,
    ended:false,
    plants:new Map(),
    zombies:[],
    shots:[],
    particles:[],
    texts:[],
    spawn:2.5,
    sky:4
  };
}

game = freshGame();

const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const rand = (a,b) => Math.random()*(b-a)+a;
const id = (r,c) => `${r}:${c}`;

function position(row,col) {
  return {
    x:BOARD.x + col*BOARD.cellW + BOARD.cellW/2,
    y:BOARD.y + row*BOARD.cellH + BOARD.cellH/2
  };
}

function selectedDefinition(plant) {
  return plant.level === 1 ? plants[plant.type] : fusions[plant.type];
}

function updateSun() {
  sunLabel.textContent = Math.floor(game.sun);
}

function text(value,x,y,color="#fff") {
  game.texts.push({value,x,y,color,life:1.2});
}

function particles(x,y,color,count=10) {
  for (let i=0;i<count;i++) {
    const angle=rand(0,Math.PI*2);
    const speed=rand(25,105);
    game.particles.push({
      x,y,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,
      radius:rand(2,6),
      color,
      life:rand(.3,.8)
    });
  }
}

function giveSun(value,x,y) {
  game.sun += value;
  game.score += value;
  text(`+${value} ☀`,x,y,"#ffdf52");
  updateSun();
}

function createSeedButtons() {
  seedBar.replaceChildren();

  for (const [type,data] of Object.entries(plants)) {
    const button=document.createElement("button");
    button.className="seed";
    button.innerHTML=`${data.label}<small>${data.cost} ☀</small>`;
    if (game.selected===type) button.classList.add("selected");

    button.onclick=()=>{
      game.selected=type;
      createSeedButtons();
    };

    seedBar.appendChild(button);
  }

  updateSun();
}

function place(row,col) {
  if (!game.running || game.ended) return;

  const key=id(row,col);
  const existing=game.plants.get(key);

  if (existing) {
    if (existing.type===game.selected && existing.level===1) {
      existing.level=2;
      existing.hp=fusions[existing.type].hp;
      existing.maxHp=existing.hp;
      particles(existing.x,existing.y,fusions[existing.type].color,30);
      text(fusions[existing.type].label,existing.x,existing.y-50,"#ffe66b");
    } else {
      text("Place a matching plant to fuse",existing.x,existing.y-45,"#ffec9d");
    }
    return;
  }

  const definition=plants[game.selected];

  if (game.sun<definition.cost) {
    text("Not enough sun",...Object.values(position(row,col)),"#ff9187");
    return;
  }

  game.sun-=definition.cost;
  const p=position(row,col);

  game.plants.set(key,{
    row,
    col,
    type:game.selected,
    level:1,
    x:p.x,
    y:p.y,
    hp:definition.hp,
    maxHp:definition.hp,
    timer:rand(0,.5),
    shots:0
  });

  particles(p.x,p.y,definition.color,16);
  updateSun();
}

function spawnZombie() {
  const row=Math.floor(Math.random()*ROWS);
  const elite=Math.random()<Math.min(.3,game.time/200);
  const hp=elite ? 360+game.wave*25 : 145+game.wave*20;

  game.zombies.push({
    row,
    x:1240+rand(0,90),
    y:position(row,8).y,
    hp,
    maxHp:hp,
    speed:elite?15:24+game.wave*.7,
    damage:elite?31:18,
    attack:0,
    elite,
    phase:rand(0,10)
  });
}

function nearestZombie(row,x) {
  return game.zombies
    .filter(z=>z.row===row && z.x>x-15)
    .sort((a,b)=>a.x-b.x)[0];
}

function fire(plant,damage,color,second=false) {
  game.shots.push({
    x:plant.x+36,
    y:plant.y-5,
    row:plant.row,
    damage,
    color,
    speed:430,
    radius:second?7:10
  });
}

function update(dt) {
  if (!game.running || game.ended) return;

  game.time+=dt;
  game.wave=1+Math.floor(game.time/25);

  game.spawn-=dt;
  if (game.spawn<=0) {
    spawnZombie();
    game.spawn=Math.max(.7,3.3-game.time/100);
  }

  game.sky-=dt;
  if (game.sky<=0) {
    giveSun(25,rand(230,1120),rand(100,570));
    game.sky=rand(7,11);
  }

  updatePlants(dt);
  updateShots(dt);
  updateZombies(dt);
  updateEffects(dt);

  if (game.time>180 && game.zombies.length===0) finish("LAWN SECURED");
}

function updatePlants(dt) {
  for (const p of game.plants.values()) {
    const d=selectedDefinition(p);
    p.timer-=dt;

    if (p.type==="sun") {
      if (p.timer<=0) {
        giveSun(p.level===1?25:d.sun,p.x,p.y-35);
        p.timer=d.cooldown;
      }
      continue;
    }

    if (p.type==="wall") continue;

    if (p.timer<=0 && nearestZombie(p.row,p.x)) {
      fire(p,d.damage,d.color);
      p.shots++;

      if (p.level===2 && d.double) {
        setTimeout(()=>{
          if (game.running && game.plants.has(id(p.row,p.col))) {
            fire(p,d.damage*.75,d.color,true);
          }
        },120);
      }

      if (p.timer<=0) p.timer=d.cooldown;
    }
  }
}

function updateShots(dt) {
  for (const shot of game.shots) {
    shot.x+=shot.speed*dt;

    const target=game.zombies.find(z=>
      z.row===shot.row && Math.abs(z.x-shot.x)<25
    );

    if (target) {
      target.hp-=shot.damage;
      particles(target.x,target.y,shot.color,4);
      shot.dead=true;

      if (target.hp<=0) {
        game.score+=target.elite?40:20;
        particles(target.x,target.y,target.elite?"#dc9cff":"#b5d79e",20);
      }
    }
  }

  game.shots=game.shots.filter(s=>!s.dead&&s.x<W+50);
}

function updateZombies(dt) {
  for (const z of game.zombies) {
    const blocker=[...game.plants.values()].find(p=>
      p.row===z.row && Math.abs(p.x-z.x)<58
    );

    if (blocker) {
      z.attack-=dt;
      if (z.attack<=0) {
        blocker.hp-=z.damage;
        z.attack=.75;

        if (blocker.hp<=0) {
          game.plants.delete(id(blocker.row,blocker.col));
          particles(blocker.x,blocker.y,"#e8755d",24);
        }
      }
    } else {
      z.x-=z.speed*dt;
    }

    if (z.x<145) finish("THE ZOMBIES REACHED THE HOUSE");
  }

  game.zombies=game.zombies.filter(z=>z.hp>0);
}

function updateEffects(dt) {
  for (const p of game.particles) {
    p.life-=dt;
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.vy+=100*dt;
  }

  for (const t of game.texts) {
    t.life-=dt;
    t.y-=24*dt;
  }

  game.particles=game.particles.filter(p=>p.life>0);
  game.texts=game.texts.filter(t=>t.life>0);
}

function finish(message) {
  game.ended=true;
  notice.textContent=message;
  notice.classList.add("show");
}

function rounded(x,y,w,h,r,fill) {
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
  ctx.fillStyle=fill;
  ctx.fill();
}

function draw() {
  drawBackground();
  drawBoard();
  drawPlants();
  drawShots();
  drawZombies();
  drawEffects();
}

function drawBackground() {
  const gradient=ctx.createLinearGradient(0,0,0,H);
  gradient.addColorStop(0,"#86bd6c");
  gradient.addColorStop(1,"#315d38");
  ctx.fillStyle=gradient;
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle="#243c29";
  ctx.fillRect(0,0,W,72);

  ctx.fillStyle="#e1f4bd";
  ctx.font="800 21px system-ui";
  ctx.fillText(`Wave ${game.wave}`,25,43);

  ctx.font="600 15px system-ui";
  ctx.fillStyle="#bad5a8";
  ctx.fillText(`Score ${game.score}  •  ${Math.floor(game.time)}s`,130,43);
}

function drawBoard() {
  ctx.fillStyle="#805531";
  ctx.fillRect(0,72,W,600);

  for (let r=0;r<ROWS;r++) {
    for (let c=0;c<COLS;c++) {
      const x=BOARD.x+c*BOARD.cellW;
      const y=BOARD.y+r*BOARD.cellH;
      ctx.fillStyle=(r+c)%2?"#5aa54d":"#66b653";
      ctx.fillRect(x+2,y+2,BOARD.cellW-4,BOARD.cellH-4);
      ctx.strokeStyle="#b2e28366";
      ctx.strokeRect(x+2,y+2,BOARD.cellW-4,BOARD.cellH-4);
    }
  }

  ctx.fillStyle="#e1f4bd";
  ctx.font="800 16px system-ui";
  ctx.fillText("HOUSE",45,365);
  ctx.fillStyle="#283b27";
  ctx.fillText("ZOMBIE APPROACH",1030,78);
}

function drawPlants() {
  for (const p of game.plants.values()) {
    const d=selectedDefinition(p);
    const scale=p.level===2?1.2:1;

    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.scale(scale,scale);

    ctx.fillStyle="#0004";
    ctx.beginPath();
    ctx.ellipse(0,40,38,10,0,0,Math.PI*2);
    ctx.fill();

    ctx.font=`${p.level===2?55:45}px serif`;
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(
      p.level===2
        ? ({pea:"🌿",sun:"🌼",wall:"🏰"}[p.type])
        : ({pea:"🌱",sun:"🌻",wall:"🥜"}[p.type]),
      0,0
    );

    if (p.level===2) {
      ctx.strokeStyle="#ffe15d";
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.arc(0,0,35,0,Math.PI*2);
      ctx.stroke();
    }

    ctx.restore();

    const ratio=clamp(p.hp/p.maxHp,0,1);
    ctx.fillStyle="#172718";
    ctx.fillRect(p.x-35,p.y+44,70,7);
    ctx.fillStyle=ratio>.35?"#7de66d":"#ff776e";
    ctx.fillRect(p.x-35,p.y+44,70*ratio,7);
  }
}

function drawShots() {
  for (const s of game.shots) {
    ctx.fillStyle=s.color;
    ctx.shadowColor=s.color;
    ctx.shadowBlur=14;
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.radius,0,Math.PI*2);
    ctx.fill();
    ctx.shadowBlur=0;
  }
}

function drawZombies() {
  for (const z of game.zombies) {
    const bob=Math.sin(game.time*5+z.phase)*3;

    ctx.save();
    ctx.translate(z.x,z.y+bob);
    ctx.fillStyle="#0004";
    ctx.beginPath();
    ctx.ellipse(0,40,34,10,0,0,Math.PI*2);
    ctx.fill();

    ctx.font=`${z.elite?54:46}px serif`;
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(z.elite?"🧟‍♂️":"🧟",0,0);
    ctx.restore();

    const ratio=clamp(z.hp/z.maxHp,0,1);
    ctx.fillStyle="#172718";
    ctx.fillRect(z.x-31,z.y-44,62,7);
    ctx.fillStyle=z.elite?"#d291ff":"#e86e63";
    ctx.fillRect(z.x-31,z.y-44,62*ratio,7);
  }
}

function drawEffects() {
  for (const p of game.particles) {
    ctx.globalAlpha=clamp(p.life/.8,0,1);
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);
    ctx.fill();
  }

  ctx.textAlign="center";
  ctx.font="800 17px system-ui";

  for (const t of game.texts) {
    ctx.globalAlpha=clamp(t.life/1.2,0,1);
    ctx.fillStyle=t.color;
    ctx.fillText(t.value,t.x,t.y);
  }

  ctx.globalAlpha=1;
}

function canvasPoint(event) {
  const rect=canvas.getBoundingClientRect();
  return {
    x:(event.clientX-rect.left)*W/rect.width,
    y:(event.clientY-rect.top)*H/rect.height
  };
}

canvas.addEventListener("pointerdown",event=>{
  const p=canvasPoint(event);
  const col=Math.floor((p.x-BOARD.x)/BOARD.cellW);
  const row=Math.floor((p.y-BOARD.y)/BOARD.cellH);

  if (row>=0&&row<ROWS&&col>=0&&col<COLS) {
    place(row,col);
  }
});

pauseButton.onclick=()=>{
  if (game.ended) return;
  game.running=!game.running;
  pauseButton.textContent=game.running?"Pause":"Resume";
};

restartButton.onclick=()=>{
  game=freshGame();
  notice.classList.remove("show");
  pauseButton.textContent="Pause";
  createSeedButtons();
};

window.addEventListener("keydown",event=>{
  if (event.key===" ") {
    event.preventDefault();
    pauseButton.click();
  }

  const shortcuts={1:"pea",2:"sun",3:"wall"};
  if (shortcuts[event.key]) {
    game.selected=shortcuts[event.key];
    createSeedButtons();
  }
});

createSeedButtons();

let previous=performance.now();

function loop(now) {
  const dt=Math.min(.05,(now-previous)/1000);
  previous=now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
  </html>
